<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" width="100%" height="100%">
  <defs>
    <linearGradient id="esportecGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d8c18" />
      <stop offset="50%" stop-color="#72ba27" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Dynamic Top Green Swoosh Arc -->
  <path 
    d="M 55 42 C 145 14 315 12 435 34 C 330 20 170 22 55 42 Z" 
    fill="url(#esportecGreen)" 
  />

  <!-- Main Brand Typography: Bold Italic ESPORTEC -->
  <text 
    x="255" 
    y="100" 
    text-anchor="middle" 
    fill="#1e293b" 
    font-size="64" 
    font-weight="900" 
    font-style="italic" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="-0.03em"
  >ESPORTEC</text>

  <!-- Registered Trademark symbol -->
  <text 
    x="452" 
    y="66" 
    fill="#1e293b" 
    font-size="16" 
    font-weight="800" 
    font-style="normal"
    font-family="system-ui, -apple-system, sans-serif"
  >®</text>

  <!-- Left Green Accent Line -->
  <line 
    x1="52" 
    y1="124" 
    x2="135" 
    y2="124" 
    stroke="#72ba27" 
    stroke-width="3.5" 
    stroke-linecap="round" 
  />

  <!-- ECO-INDUSTRIEL Subtitle in Bold Italic Tracking -->
  <text 
    x="255" 
    y="129" 
    text-anchor="middle" 
    fill="#1e293b" 
    font-size="18" 
    font-weight="800" 
    font-style="italic" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="0.26em"
  >ECO-INDUSTRIEL</text>

  <!-- Right Green Accent Line -->
  <line 
    x1="375" 
    y1="124" 
    x2="458" 
    y2="124" 
    stroke="#72ba27" 
    stroke-width="3.5" 
    stroke-linecap="round" 
  />

  <!-- Baseline: La qualité environnementale vue du sol -->
  <text 
    x="255" 
    y="158" 
    text-anchor="middle" 
    fill="#334155" 
    font-size="15" 
    font-weight="700" 
    font-style="italic" 
    font-family="Georgia, 'Times New Roman', serif"
    letter-spacing="0.01em"
  >La qualité environnementale vue du sol</text>
</svg>

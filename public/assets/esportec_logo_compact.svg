    fill="url(#esportecGreenCompact)" 
  />

  <!-- Main Brand Typography: Bold Italic ESPORTEC -->
  <text 
    x="255" 
    y="96" 
    text-anchor="middle" 
    fill="#1e293b" 
    font-size="68" 
    font-weight="900" 
    font-style="italic" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="-0.03em"
  >ESPORTEC</text>

  <!-- Registered Trademark symbol -->
  <text 
    x="456" 
    y="62" 
    fill="#1e293b" 
    font-size="17" 
    font-weight="800" 
    font-style="normal"
    font-family="system-ui, -apple-system, sans-serif"
  >®</text>

  <!-- Left Green Accent Line -->
  <line 
    x1="52" 
    y1="122" 
    x2="135" 
    y2="122" 
    stroke="#72ba27" 
    stroke-width="3.5" 
    stroke-linecap="round" 
  />

  <!-- ECO-INDUSTRIEL Subtitle in Bold Italic Tracking -->
  <text 
    x="255" 
    y="127" 
    text-anchor="middle" 
    fill="#1e293b" 
    font-size="19" 
    font-weight="800" 
    font-style="italic" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="0.25em"
  >ECO-INDUSTRIEL</text>

  <!-- Right Green Accent Line -->
  <line 

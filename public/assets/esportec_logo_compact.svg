<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 135" width="100%" height="100%">
  <defs>
    <linearGradient id="esportecGreenCompact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d8c18" />
      <stop offset="50%" stop-color="#72ba27" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Dynamic Top Green Swoosh Arc -->
  <path 
